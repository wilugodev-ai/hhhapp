name: hhh
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${HHH_SQL_PASSWORD:?Set HHH_SQL_PASSWORD in .env}
      MSSQL_PID: Developer
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
  api:
    build:
      context: .
      dockerfile: src/Hhh.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Hhh: "Server=sql;Database=Hhh;User Id=sa;Password=${HHH_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Demo__Enabled: "true"
      Database__MigrateOnStartup: "true"
      AllowedHosts: "*"
    volumes:
      - protection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      sql:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:4300:8080"
    depends_on:
      - api
volumes:
  sql-data:
  protection-keys:
